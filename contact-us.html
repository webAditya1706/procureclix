    <section class="contact_form_sec">
        <div class="container-fluid section_contaier">
            <!-- <div style="width: 100%; height: 90px; background-color: red;"></div> -->
            <div class="row align-items-stretch">
                <div class="col-lg-6 col-xl-8 p-0 d-flex">
                    <div class="contact_us_card w-100 d-flex flex-column">
                        <!-- <div class="w-100"> -->
                        <h1 style="color: #565656;">Talk To Our <span class="experts">Experts</span></h1>
                        <p class="mb-3">Have questions about pricing, plans or ProcureClix? Fill out the form and
                            our expert will
                            be
                            in touch directly.</p>
                        <form class="contact_us_form">
                            <div class="row gy-3">
                                <div class="col-sm-6">
                                    <label class="form-label" for="fullName">Full Name<span
                                            class="text-danger">*</span></label>
                                    <input class="form-control" id="fullName" placeholder="Full Name" type="text" />
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label" for="workEmail">Work Email<span
                                            class="text-danger">*</span></label>
                                    <input class="form-control" id="workEmail" placeholder="Work Email" type="email" />
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label" for="companyName">Company Name<span
                                            class="text-danger">*</span></label>
                                    <input class="form-control" id="companyName" placeholder="Company Name"
                                        type="text" />
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label" for="phoneNumber">Phone Number<span
                                            class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <img alt="US Flag" class="flag_icon" loading="lazy"
                                                src="/assets/images/uk_flag.png" />
                                            <img alt="drop_down" class="drop_arrow" loading="lazy"
                                                src="/assets/icons/drop_down.png" />
                                        </span>
                                        <input class="form-control" id="phoneNumber" placeholder="Phone Number"
                                            type="tel" />
                                    </div>
                                </div>
                            </div>
                            <div class="mt-4 mb-2 fs_15_fw_500_c_1313 mb-3">Which module are you interested in?
                            </div>
                            <div class="row gx-3">
                                <div class="col-12 col-sm-6 col-xl-4">
                                    <div class="form-check mb-3">
                                        <input checked="" class="form-check-input" id="rfp" type="checkbox" />
                                        <label class="form-check-label" for="rfp">RFP | RFI | RFQ</label>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-6 col-xl-4">
                                    <div class="form-check mb-3">
                                        <input class="form-check-input" id="spendAnalysis" type="checkbox" />
                                        <label class="form-check-label" for="spendAnalysis">Spend Analysis</label>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-6 col-xl-4">
                                    <div class="form-check mb-3">
                                        <input class="form-check-input" id="reverseAuction" type="checkbox" />
                                        <label class="form-check-label" for="reverseAuction">Reverse Auction</label>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-6 col-xl-4">
                                    <div class="form-check mb-3">
                                        <input class="form-check-input" id="customSolutions" type="checkbox" />
                                        <label class="form-check-label" for="customSolutions">Custom
                                            Solutions</label>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-6 col-xl-4">
                                    <div class="form-check mb-3">
                                        <input class="form-check-input" id="purchaseRequisition" type="checkbox" />
                                        <label class="form-check-label" for="purchaseRequisition">Purchase
                                            Requisition</label>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-6 col-xl-4">
                                    <div class="form-check mb-3">
                                        <input class="form-check-input" id="supplierManagement" type="checkbox" />
                                        <label class="form-check-label" for="supplierManagement">Supplier
                                            Management</label>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-6 col-xl-4">
                                    <div class="form-check mb-3">
                                        <input class="form-check-input" id="contractManagement" type="checkbox" />
                                        <label class="form-check-label" for="contractManagement">Contract
                                            Management</label>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-1">
                                <label class="form-label" for="message">Message</label>
                                <textarea class="form-control" id="message" placeholder="Type Here" rows="8"></textarea>
                            </div>
                            <div class="text-center mt-5">
                                <button class="btn submit_btn" type="submit">Submit</button>
                            </div>
                        </form>
