<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SweetAlert Example</title>
    <!-- Include SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net">
</head>
<body>

    <h1>Using SweetAlert with Core JavaScript</h1>
    <button onclick="showSuccessAlert()">Show Success Alert</button>
    <button onclick="showWarningAlert()">Show Warning Alert</button>

    <!-- Include SweetAlert2 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // Function to display a basic success alert
        function showSuccessAlert() {
            Swal.fire({
                title: 'Success!',
                text: 'Your action was successful.',
                icon: 'success',
                confirmButtonText: 'OK'
            });
        }

        // Function to display a warning alert with confirmation
        function showWarningAlert() {
            Swal.fire({
                title: 'Are you sure?',
                text: "You won't be able to revert this!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Yes, delete it!'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire(
                        'Deleted!',
                        'Your file has been deleted.',
                        'success'
                    );
                }
            });
        }
    </script>

</body>
</html>
