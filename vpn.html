<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/images/favicon_3.png" type="image/png">

    <title>VPN Blocked</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --Gradient: linear-gradient(180deg, #004263 0%, #0086c9 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', system-ui, sans-serif;
        }

        .vpn_body {
            min-height: 100vh;
            background: var(--Gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* Card */
        .vpn_card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.15);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: clamp(20px, 4vw, 32px);
            text-align: center;
            color: #fff !important;
        }

        /* Text */
        .vpn_card p {
            font-size: clamp(14px, 2.5vw, 16px);
            line-height: 1.6;
            color: #fff !important;
        }

        .vpn_card small {
            display: block;
            margin-top: 12px;
            font-size: clamp(11px, 2vw, 13px);
            opacity: 0.85;
        }

        /* Button */
        .vpn_btn {
            /* width: 100%; */
            margin-top: 24px;
            padding: 12px;
            border-radius: 24px;
            border: none;
            background: #ffffff;
            color: #004263;
            font-size: clamp(14px, 2.5vw, 16px);
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .vpn_btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
        }


        .vpn_btn {
            margin-top: 22px;
            padding: 10px 26px;
            border-radius: 20px;
            border: none;
            background: #ffffff;
            color: #004263;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body class="page-hidden">
    <div class="vpn_body">
        <div class="vpn_card">
            <p>
                Looks like you are connecting through a VPN, proxy or "unblocker" service.
                Please turn off any of these services and try again.
            </p>
            <small>GRN: 0.ca5b2d1770007658.9d19f49</small>
            <button class="vpn_btn" onclick="location.reload()">Retry</button>
            <img src="../" alt="" srcset="">
        </div>
    </div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@17/build/css/intlTelInput.css" />
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@17/build/js/intlTelInput.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@17/build/js/utils.js"></script>

</body>

</html>
