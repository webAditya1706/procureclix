<!DOCTYPE html>
<html>

<head>
    <style>
        #new_overlay {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .new_loader {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .new_loader::before {
            content: "";
            position: absolute;
            inset: 0;
            border: 8px solid #eee;
            border-top-color: #004263;
            border-radius: 50%;
            animation: spin 1200ms linear infinite;
        }

        .new_loader img {
            width: 60px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="d-none">

    <div id="new_overlay">
        <div class="new_loader">
            <img src="/assets/images/favicon_3.png" alt="Logo">
        </div>
    </div>

   

</body>

</html>
